<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作待辦管理系統</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --success-color: #27ae60;
            --danger-color: #e74c3c; /* 新增危險/緊急顏色 */
            --bg-color: #f0f2f5;
            --text-color: #333;
            --gray-text: #777;
        }

        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            padding-bottom: 160px;
        }

        h2 { color: var(--text-color); border-left: 5px solid var(--primary-color); padding-left: 12px; margin-bottom: 20px; }

        .task-card {
            background: white;
            padding: 18px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-info { display: flex; flex-direction: column; gap: 5px; }
        .task-title { font-weight: bold; font-size: 1.2rem; color: #2c3e50; }
        .task-meta { font-size: 0.85rem; color: var(--gray-text); display: flex; gap: 15px; align-items: center; }
        .deadline-tag { color: #d35400; font-weight: bold; }

        /* 新增倒數天數的顏色樣式 */
        .countdown-green { color: var(--success-color); font-weight: bold; font-size: 1.1em; }
        .countdown-red { color: var(--danger-color); font-weight: bold; font-size: 1.1em; }

        .btn-done {
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-done:hover { background-color: #219150; }

        .history-section { margin-top: 50px; border-top: 2px dashed #ccc; padding-top: 20px; }
        .history-card { background: #f9f9f9; border: 1px solid #ddd; opacity: 0.8; }
        .history-card .task-title { text-decoration: line-through; color: #888; }

        .input-area-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 20px 0;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: center;
        }

        .input-form {
            width: 90%;
            max-width: 850px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }

        .input-group { display: flex; flex-direction: column; gap: 5px; }
        
        .group-title { flex: 2; min-width: 300px; } 
        .group-date { flex: 0.8; min-width: 150px; }

        label { font-size: 0.9rem; font-weight: bold; color: #555; }

        input[type="text"] { 
            padding: 12px; 
            border: 2px solid #ddd; 
            border-radius: 6px; 
            font-size: 1rem;
            outline: none;
        }
        input[type="text"]:focus { border-color: var(--primary-color); }

        input[type="date"] { padding: 11px; border: 2px solid #ddd; border-radius: 6px; }

        .btn-add { 
            background-color: var(--primary-color); 
            color: white; 
            border: none; 
            padding: 12px 25px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold;
            height: 48px;
        }
        .btn-add:hover { background-color: #357abd; }

        .empty-msg { text-align: center; color: #999; margin-top: 20px; font-style: italic; }
    </style>
</head>
<body>

<div class="container" id="app">
    <section>
        <h2>待辦事項 (進行中)</h2>
        <div id="pendingTasks"></div>
    </section>

    <section class="history-section">
        <h2>歷史紀錄 (已結案)</h2>
        <div id="historyTasks"></div>
    </section>
</div>

<div class="input-area-container">
    <div class="input-form">
        <div class="input-group group-title">
            <label for="taskTitle">工作內容 (輸入後按 Enter 也可以新增)</label>
            <input type="text" id="taskTitle" placeholder="請描述要做的工作...">
        </div>
        <div class="input-group group-date">
            <label for="taskDate">預計完成日期 (在此日期前完成)</label>
            <input type="date" id="taskDate">
        </div>
        <button class="btn-add" onclick="addTask()">新增待辦</button>
    </div>
</div>

<script>
    let tasks = JSON.parse(localStorage.getItem('myTasks')) || [];

    // 初始化日期：預設為明天
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    document.getElementById('taskDate').valueAsDate = tomorrow;

    function render() {
        const pendingContainer = document.getElementById('pendingTasks');
        const historyContainer = document.getElementById('historyTasks');
        
        pendingContainer.innerHTML = '';
        historyContainer.innerHTML = '';

        const pendingList = tasks.filter(t => !t.completed);
        const historyList = tasks.filter(t => t.completed);

        if (pendingList.length === 0) {
            pendingContainer.innerHTML = '<p class="empty-msg">目前沒有待辦事項，太棒了！</p>';
        }
        
        // 取得今天的日期 (清除時間部分，以便準確計算天數)
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        pendingList.forEach(task => {
            // 計算倒數天數
            const deadlineDate = new Date(task.deadline);
            deadlineDate.setHours(0, 0, 0, 0);
            
            const diffTime = deadlineDate - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            let countdownHtml = "";
            if (diffDays > 5) {
                countdownHtml = `(剩餘 <span class="countdown-green">${diffDays}</span> 天)`;
            } else if (diffDays > 0 && diffDays <= 5) {
                countdownHtml = `(剩餘 <span class="countdown-red">${diffDays}</span> 天)`;
            } else if (diffDays === 0) {
                countdownHtml = `(<span class="countdown-red">今天到期！</span>)`;
            } else {
                countdownHtml = `(<span class="countdown-red">已逾期 ${Math.abs(diffDays)} 天</span>)`;
            }

            pendingContainer.innerHTML += `
                <div class="task-card">
                    <div class="task-info">
                        <span class="task-title">${task.title}</span>
                        <div class="task-meta">
                            <span>🕒 登錄日期: ${task.createdDate}</span>
                            <span class="deadline-tag">📅 預計完成日期: ${task.deadline}</span>
                            <span>${countdownHtml}</span>
                        </div>
                    </div>
                    <button class="btn-done" onclick="completeTask(${task.id})">結案</button>
                </div>
            `;
        });

        historyList.forEach(task => {
            historyContainer.innerHTML += `
                <div class="task-card history-card">
                    <div class="task-info">
                        <span class="task-title">${task.title}</span>
                        <div class="task-meta">
                            <span>登錄: ${task.createdDate}</span>
                            <span>完成: ${new Date().toLocaleDateString()}</span>
                        </div>
                    </div>
                    <span style="color: #27ae60; font-weight: bold;">✓ 已完成</span>
                </div>
            `;
        });

        localStorage.setItem('myTasks', JSON.stringify(tasks));
    }

    function addTask() {
        const titleInput = document.getElementById('taskTitle');
        const dateInput = document.getElementById('taskDate');

        if (!titleInput.value.trim()) {
            alert("請輸入工作內容！");
            return;
        }

        const today = new Date();
        const newTask = {
            id: Date.now(),
            title: titleInput.value,
            deadline: dateInput.value,
            createdDate: today.toLocaleDateString(),
            completed: false
        };

        tasks.unshift(newTask);
        titleInput.value = '';
        render();
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function completeTask(id) {
        const index = tasks.findIndex(t => t.id === id);
        if (index !== -1) {
            tasks[index].completed = true;
            render();
        }
    }

    document.getElementById('taskTitle').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') addTask();
    });

    render();
</script>

</body>
</html>
